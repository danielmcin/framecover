[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "danielmcin-framecover"
version = "0.1.0"
description = "解析时间标记，排列视频抽帧的覆盖率的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "danielmcin" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://danielmcin.github.io"
Repository = "https://github.com/danielmcin/framecover"
Issues = "https://github.com/danielmcin/framecover/issues"

[project.scripts]
framecover = "framecover:main"

[tool.setuptools]
py-modules = ["framecover"]
